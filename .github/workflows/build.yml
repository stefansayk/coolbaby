name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Diagnose (nur bei Fehlern)
        if: failure()
        run: |
          {
            echo "### compiler errors"; grep -nE "error:|warning:|symbol:|location:|\^" build.log | head -200
            JAR=$(find ~/.gradle/caches .gradle -name 'minecraft-*.jar' 2>/dev/null | grep -vE 'sources|client-only' | head -1)
            echo "### minecraft jar: $JAR"
            CJAR=$(find ~/.gradle/caches .gradle -name 'minecraft-*client*.jar' 2>/dev/null | grep -v sources | head -1)
            echo "### client jar: $CJAR"
            for c in net.minecraft.client.KeyMapping 'net.minecraft.client.KeyMapping$Category' com.mojang.blaze3d.platform.InputConstants; do
              echo "=== $c"; javap -cp "$CJAR" "$c" 2>&1 | grep -iE 'class |record |Category|register|KeyMapping\(|Type |consumeClick' | head -30
            done
            for c in net.minecraft.client.KeyMapping 'net.minecraft.client.KeyMapping$Category' \
                     net.minecraft.network.protocol.common.custom.CustomPacketPayload \
                     'net.minecraft.network.protocol.common.custom.CustomPacketPayload$Type' \
                     net.minecraft.network.codec.StreamCodec net.minecraft.server.MinecraftServer \
                     net.minecraft.commands.Commands net.minecraft.commands.CommandSourceStack net.minecraft.server.level.ServerPlayer; do
              echo "=== $c"; javap -cp "$JAR" "$c" 2>&1 | grep -iE 'class |interface |record |Category|register|unit|createCommandSourceStack|performPrefixedCommand|withSuppressedOutput|KeyMapping\(|Type\(|getStringUUID' | head -40
            done
            for j in $(find ~/.gradle/caches -name 'fabric-networking-api-v1*.jar' -o -name 'fabric-key-binding-api-v1*.jar' -o -name 'fabric-lifecycle-events-v1*.jar' 2>/dev/null | grep -v sources | sort -u | head -12); do
              echo "=== jar $j"
              for cls in $(unzip -Z1 "$j" | grep -E 'api/.*\.class$' | grep -vE '\$[0-9]' | sed 's/\.class$//; s#/#.#g' | grep -iE 'PayloadTypeRegistry|PlayNetworking|KeyBinding|KeyMapping|ClientTickEvents|ServerTickEvents'); do
                echo "--- $cls"; javap -cp "$j" "$cls" 2>&1 | head -40
              done
            done
            echo "### fabric modules"; find ~/.gradle/caches -name 'fabric-*.jar' 2>/dev/null | grep -v sources | xargs -n1 basename | sort -u
            for j in $(find ~/.gradle/caches -name 'fabric-*key*.jar' 2>/dev/null | grep -v sources | sort -u); do
              echo "=== keyjar $j"
              for cls in $(unzip -Z1 "$j" | grep -E 'api/.*\.class$' | grep -vE '\$[0-9]' | sed 's/\.class$//; s#/#.#g'); do echo "--- $cls"; javap -cp "$j" "$cls" 2>&1 | head -20; done
            done
          } > diag.txt 2>&1 || true
          mkdir -p /tmp/out && cp build.log diag.txt /tmp/out/
          git config user.name "ci-log"; git config user.email "ci-log@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --cached . -q
          rm -rf out && mkdir out && cp /tmp/out/* out/
          git add -f out
          git commit -q -m "build log ${GITHUB_SHA}"
          git push -f origin HEAD:ci-log
      - name: Mod-Datei veröffentlichen (Release + Zweig jar)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          cp "$JAR" /tmp/mythic-legenden.jar
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest /tmp/mythic-legenden.jar --title "Mythic Legenden (neuester Bau)" --notes "Automatisch gebaut aus ${GITHUB_SHA}. Für Minecraft 26.2 mit Fabric Loader und Fabric API." --latest
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan jar
          git rm -rf --cached . -q
          rm -rf out && mkdir out && cp /tmp/mythic-legenden.jar out/
          git add -f out
          git commit -q -m "jar ${GITHUB_SHA}"
          git push -f origin HEAD:jar
      - uses: actions/upload-artifact@v7
        with:
          name: Mythic-Legenden-Mod
          path: build/libs/
